<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID PAINTER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:flex;justify-content:center}
.app{width:min(1180px,100%);min-height:100vh;padding:22px;display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr auto;gap:16px}
header{grid-column:1/-1;border:1px solid #2e2e2e;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:#151515}
.logo{font-weight:900;letter-spacing:.2em}.sub{font-size:10px;color:#777}
.side{border:1px solid #2e2e2e;background:#151515;padding:14px;display:flex;flex-direction:column;gap:15px}
.group{border-bottom:1px solid #292929;padding-bottom:14px}.group:last-child{border:0;padding:0}
.label{font-size:10px;color:#777;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw{aspect-ratio:1;border:1px solid #444;cursor:pointer}.sw.active{outline:2px solid #fff;outline-offset:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button,select{width:100%;background:#1e1e1e;color:#eee;border:1px solid #3a3a3a;padding:9px 8px;font:inherit;font-size:11px;cursor:pointer}
button:hover{background:#272727}
button.on{background:#eee;color:#111}
.workspace{border:1px solid #2e2e2e;background:#0c0c0c;display:flex;align-items:center;justify-content:center;padding:20px;min-width:0;position:relative;overflow:hidden}
#grid{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair;background:#000;box-shadow:0 20px 70px #000;max-width:100%;max-height:100%}
.hint{position:absolute;right:12px;bottom:10px;color:#555;font-size:9px}
footer{grid-column:1/-1;border:1px solid #2e2e2e;background:#151515;padding:10px 14px;display:flex;gap:14px;align-items:center;justify-content:space-between;font-size:10px;color:#666}
.status{color:#aaa}
input[type=range]{width:100%;accent-color:#eee}
@media(max-width:800px){
.app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(420px,1fr) auto;padding:10px}
.side{order:2}
.workspace{order:3;padding:12px;min-height:60vh}
header{order:1}footer{order:4}
}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">VOID PAINTER</div><div class="sub">PIXEL LAB / 32×32</div></header>

<aside class="side">
<div class="group">
<div class="label">Color</div>
<div id="palette" class="palette"></div>
</div>

<div class="group">
<div class="label">Herramientas</div>
<div class="tools">
<button id="pen" class="on">PINCEL</button><button id="erase">BORRADOR</button>
<button id="mirror">SIMETRÍA</button><button id="clear">LIMPIAR</button>
<button id="random">ALEATORIO</button><button id="undo">DESHACER</button>
</div>
</div>

<div class="group">
<div class="label">Tamaño</div>
<select id="size"><option value="16">16 × 16</option><option value="24">24 × 24</option><option value="32" selected>32 × 32</option><option value="48">48 × 48</option></select>
</div>

<div class="group">
<div class="label">Zoom</div>
<input id="zoom" type="range" min="8" max="22" value="16">
</div>

<div class="group">
<div class="label">Archivo</div>
<div class="tools">
<button id="save">GUARDAR PNG</button><button id="example">EJEMPLO</button>
</div>
</div>
</aside>

<main class="workspace" id="work">
<canvas id="grid"></canvas>
<div class="hint">clic / arrastrá para pintar · doble toque = borrar</div>
</main>

<footer><span class="status" id="status">READY · CELDA 32×32</span><span>HECHO EN EL NAVEGADOR · SIN SUBIR NADA</span></footer>
</div>

<script>
const canvas=document.getElementById('grid'),ctx=canvas.getContext('2d');
const palette=document.getElementById('palette'),work=document.getElementById('work');
const sizeSel=document.getElementById('size'),zoom=document.getElementById('zoom'),status=document.getElementById('status');
const colors=['#ffffff','#d8d8d8','#999999','#555555','#161616','#ff4d6d','#ff8a3d','#ffd166','#7ee787','#35d0ba','#4da3ff','#8b7cff','#d36bff','#ff75c3','#7b4b2a','#002b36'];
let N=32,cell=16,pixels=[],selected=0,erase=false,mirror=false,drawing=false,history=[];
function blank(n=N){return Array.from({length:n},()=>Array(n).fill(null))}
function setup(n){
 N=n;pixels=blank(N);history=[];status.textContent='READY · CELDA '+N+'×'+N;fit();draw()
}
function pushHistory(){history.push(pixels.map(r=>r.slice()));if(history.length>30)history.shift()}
function fit(){
 const maxW=Math.max(220,work.clientWidth-40),maxH=Math.max(260,work.clientHeight-40);
 cell=Math.max(6,Math.floor(Math.min(maxW/N,maxH/N)));
 canvas.width=N*cell;canvas.height=N*cell;canvas.style.width=canvas.width+'px';canvas.style.height=canvas.height+'px';
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#050505';ctx.fillRect(0,0,canvas.width,canvas.height);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const c=pixels[y][x];if(c){ctx.fillStyle=c;ctx.fillRect(x*cell,y*cell,cell,cell)}
 }
 ctx.strokeStyle='rgba(255,255,255,.11)';ctx.lineWidth=1;
 for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*cell+.5,0);ctx.lineTo(i*cell+.5,N*cell);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell+.5);ctx.lineTo(N*cell,i*cell+.5);ctx.stroke()}
 if(mirror){ctx.strokeStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.moveTo(canvas.width/2+.5,0);ctx.lineTo(canvas.width/2+.5,canvas.height);ctx.stroke()}
}
function paintAt(e){
 const r=canvas.getBoundingClientRect(),px=Math.floor((e.clientX-r.left)/r.width*N),py=Math.floor((e.clientY-r.top)/r.height*N);
 if(px<0||py<0||px>=N||py>=N)return;
 if(!drawing)pushHistory();
 const value=erase?null:colors[selected];
 pixels[py][px]=value;
 if(mirror)pixels[py][N-1-px]=value;
 status.textContent=(erase?'ERASING':'PAINTING')+' · '+px+','+py;
 draw();
}
function pointer(e){e.preventDefault();if(e.pointerType==='mouse'&&e.buttons===0)return;paintAt(e)}
canvas.addEventListener('pointerdown',e=>{drawing=true;paintAt(e);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drawing)paintAt(e)});
canvas.addEventListener('pointerup',()=>drawing=false);
canvas.addEventListener('pointercancel',()=>drawing=false);
canvas.addEventListener('dblclick',e=>{erase=true;paintAt(e);erase=false});

colors.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i===0?' active':'');b.style.background=c;b.title=c;b.onclick=()=>{selected=i;erase=false;document.getElementById('pen').classList.add('on');document.getElementById('erase').classList.remove('on');document.querySelectorAll('.sw').forEach(s=>s.classList.remove('active'));b.classList.add('active')};palette.appendChild(b)});

document.getElementById('pen').onclick=()=>{erase=false;document.getElementById('pen').classList.add('on');document.getElementById('erase').classList.remove('on')};
document.getElementById('erase').onclick=()=>{erase=true;document.getElementById('erase').classList.add('on');document.getElementById('pen').classList.remove('on')};
document.getElementById('mirror').onclick=e=>{mirror=!mirror;e.currentTarget.classList.toggle('on',mirror);draw()};
document.getElementById('clear').onclick=()=>{pushHistory();pixels=blank();draw()};
document.getElementById('undo').onclick=()=>{const old=history.pop();if(old){pixels=old;draw();status.textContent='UNDO · '+N+'×'+N}};
document.getElementById('random').onclick=()=>{
 pushHistory();pixels=blank();
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(Math.random()<.18)pixels[y][x]=colors[Math.floor(Math.random()*colors.length)];
 draw();status.textContent='GENERATED · RANDOM';
};
document.getElementById('example').onclick=()=>{
 pushHistory();pixels=blank();const cx=(N-1)/2,cy=(N-1)/2;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const d=Math.hypot(x-cx,y-cy);
  if(d<N*.34)pixels[y][x]=d<N*.12?'#ffd166':(d<N*.23?'#ff4d6d':'#8b7cff');
 }
 for(let i=0;i<N;i++){pixels[0][i]='#35d0ba';pixels[N-1][i]='#35d0ba';pixels[i][0]='#35d0ba';pixels[i][N-1]='#35d0ba'}
 draw();status.textContent='LOADED · EXAMPLE';
};
zoom.oninput=()=>{cell=Number(zoom.value);fit();draw()};
sizeSel.onchange=()=>setup(Number(sizeSel.value));
document.getElementById('save').onclick=()=>{
 const out=document.createElement('canvas');out.width=N;out.height=N;const o=out.getContext('2d');
 o.fillStyle='#000';o.fillRect(0,0,N,N);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(pixels[y][x]){o.fillStyle=pixels[y][x];o.fillRect(x,y,1,1)}
 const a=document.createElement('a');a.download='void-painter-'+N+'x'+N+'.png';a.href=out.toDataURL('image/png');a.click();status.textContent='EXPORTED · PNG READY';
};
addEventListener('resize',()=>{fit();draw()});
setup(32);
</script>
</body>
</html>
